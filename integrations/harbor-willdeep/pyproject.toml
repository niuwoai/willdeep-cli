[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "willdeep-harbor"
version = "0.1.0-rc1"
description = "Harbor agent adapter that drives willdeep-cli inside Terminal-Bench sandboxes"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "harbor>=0.1.0",
  "pydantic>=2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["."]
include = ["willdeep_harbor*"]

