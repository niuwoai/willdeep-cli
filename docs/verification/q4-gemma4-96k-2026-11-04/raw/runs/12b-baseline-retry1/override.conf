[Unit]
Description=llama.cpp CUDA - Gemma4 12b baseline (96K single route, port 11435)

[Service]
ExecStartPre=
ExecStartPre=-/usr/bin/docker rm -f gemma4-12b-baseline-retry1-96k
ExecStart=
ExecStart=/usr/bin/docker run --rm --name gemma4-12b-baseline-retry1-96k --gpus all --network host --memory 28g --cpus 16 -v /home/ml-data/src/llama.cpp-b10549/build-cuda-sm120:/llama:ro -v /home/ml-data/opt-models/gemma4-q4-trial-20261104/12b:/models:ro -v /etc/qwen38:/config:ro --entrypoint /llama/bin/llama-server nvidia/cuda:12.9.1-devel-ubuntu24.04 --model /models/gemma-4-12b-it-qat-q4_0.gguf --alias gemma-4-12b-qat,qwen3.6-35b-a3b,qwen3.8-27b --api-key-file /config/api-key --host 0.0.0.0 --port 11435 --n-gpu-layers 99 --ctx-size 98304 --cache-type-k q4_0 --cache-type-v q4_0 --flash-attn on --parallel 1 --batch-size 512 --ubatch-size 128 --reasoning-preserve --jinja
