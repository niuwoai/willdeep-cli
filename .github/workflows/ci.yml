name: CI

on:
  # 有 PR 的分支只由 pull_request 触发。push 与 pull_request 各跑一套会把同一提交占两次名额，
  # Free 计划的 macOS 并发只有 5 个，且整个组织共用。
  push:
    branches: [develop, main]
    tags: ['v*']
  pull_request:
  workflow_call:

# 同一分支（含合并队列的 merge_group）只保留最新一次。新提交取消还在排队或执行中的旧跑，
# 腾出 runner 名额。取消只作用于本 workflow 内同组的 run，不会波及 PR 上其他 workflow 的检查。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    permissions:
      contents: read
      actions: write
    strategy:
      # 各平台独立出结果：一个平台失败不连带取消其余平台，否则看不到它们各自的问题。
      fail-fast: false
      matrix:
        # Windows 不再发版，也不再跑 CI。windows-latest 的测试反复因 runner 上的进程枚举超时失败，
        # 而发布步骤依赖整份验证，一次失败就把已经编好的 macOS 和 Linux 包也卡住。
        os: [macos-latest, ubuntu-latest]
    # 托管协调者不依赖自建 runner 接单；保留 test (matrix.os) 检查名称。
    runs-on: ${{ matrix.os }}
    # 5 分钟排队 + 60 分钟自建 + 60 分钟托管，以及 API/checkout 余量。
    timeout-minutes: 135
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Detect code changes
        id: changes
        uses: ./.github/actions/ci-changes
      - name: Attempt bounded self-hosted suite
        id: self_hosted
        # push 与本仓库自己的 pull_request 才派自建。pull_request 的 github.event.repository
        # 是基线仓库，看它的 fork 字段挡不住从 fork 开来的 PR，所以要比对 head 仓库。
        # tag、workflow_call（发版复用）和 fork 来的 PR 直接走托管。
        if: steps.changes.outputs.code == 'true' && (github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && github.workflow == 'CI' && github.workflow_ref == format('{0}/.github/workflows/ci.yml@{1}', github.repository, github.ref) && !startsWith(github.ref, 'refs/tags/') && github.event.repository.fork == false
        continue-on-error: true
        timeout-minutes: 70
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CI_WORKER_OS: ${{ matrix.os }}
          # PR 的 GITHUB_REF/SHA 是合并提交；派发入口必须用真实源分支。
          CI_DISPATCH_REF: ${{ github.head_ref && format('refs/heads/{0}', github.head_ref) || github.ref }}
          CI_DISPATCH_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: ruby scripts/ci_self_hosted_attempt.rb
      - name: Run complete hosted CI suite
        # 缺失输出、脚本异常和首次 dispatch 尚未注册都必须进入托管；失败不能被吞掉。
        if: ${{ !cancelled() && steps.changes.outputs.code == 'true' && steps.self_hosted.outputs.self_hosted_passed != 'true' }}
        timeout-minutes: 60
        uses: ./.github/actions/ci-test

  linux-architectures:
    name: Linux ${{ matrix.target }}
    # 每个架构跑在同架构的原生 runner 上。aarch64 以前在 x86 上走 cross 容器（Ubuntu 16.04，
    # git 2.7），不认 `git init -b`、`git status --porcelain=v1`，测试环境比产品要求的 git 还老。
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Detect code changes
        id: changes
        uses: ./.github/actions/ci-changes
      - uses: actions/setup-node@v4
        if: steps.changes.outputs.code == 'true'
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: web/yarn.lock
      - name: Build embedded Web frontend
        if: steps.changes.outputs.code == 'true'
        working-directory: web
        run: yarn install --frozen-lockfile && yarn build
      - uses: houseabsolute/actions-rust-cross@v1
        if: steps.changes.outputs.code == 'true'
        with:
          command: test
          target: ${{ matrix.target }}
          args: --locked --workspace

  wsl-smoke:
    name: WSL ABI smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect code changes
        id: changes
        uses: ./.github/actions/ci-changes
      - uses: actions/setup-node@v4
        if: steps.changes.outputs.code == 'true'
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: web/yarn.lock
      - name: Build embedded Web frontend
        if: steps.changes.outputs.code == 'true'
        working-directory: web
        run: yarn install --frozen-lockfile && yarn build
      - uses: dtolnay/rust-toolchain@stable
        if: steps.changes.outputs.code == 'true'
        with:
          toolchain: 1.94.1
      - name: Build the Linux x86_64 binary consumed by WSL 2
        if: steps.changes.outputs.code == 'true'
        run: cargo build --locked --release --target x86_64-unknown-linux-gnu -p willdeep
      - name: Smoke test executable and ELF ABI
        if: steps.changes.outputs.code == 'true'
        run: |
          target/x86_64-unknown-linux-gnu/release/willdeep --version
          file target/x86_64-unknown-linux-gnu/release/willdeep | grep 'ELF 64-bit LSB'
