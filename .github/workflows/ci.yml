name: CI

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    permissions:
      contents: read
      actions: write
    strategy:
      # 各平台独立出结果：一个平台失败不连带取消其余平台，否则看不到它们各自的问题。
      fail-fast: false
      matrix:
        # Windows 不再发版，也不再跑 CI。windows-latest 的测试反复因 runner 上的进程枚举超时失败，
        # 而发布步骤依赖整份验证，一次失败就把已经编好的 macOS 和 Linux 包也卡住。
        os: [macos-latest, ubuntu-latest]
    # 托管协调者不依赖自建 runner 接单；保留 test (matrix.os) 检查名称。
    runs-on: ${{ matrix.os }}
    # 5 分钟排队 + 60 分钟自建 + 60 分钟托管，以及 API/checkout 余量。
    timeout-minutes: 135
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Attempt bounded self-hosted suite
        id: self_hosted
        if: github.event_name == 'push' && github.workflow == 'CI' && github.workflow_ref == format('{0}/.github/workflows/ci.yml@{1}', github.repository, github.ref) && !startsWith(github.ref, 'refs/tags/') && github.event.repository.fork == false
        continue-on-error: true
        timeout-minutes: 70
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CI_WORKER_OS: ${{ matrix.os }}
        run: ruby scripts/ci_self_hosted_attempt.rb
      - name: Run complete hosted CI suite
        # 缺失输出、脚本异常和首次 dispatch 尚未注册都必须进入托管；失败不能被吞掉。
        if: ${{ !cancelled() && steps.self_hosted.outputs.self_hosted_passed != 'true' }}
        timeout-minutes: 60
        uses: ./.github/actions/ci-test

  linux-architectures:
    name: Linux ${{ matrix.target }}
    # 每个架构跑在同架构的原生 runner 上。aarch64 以前在 x86 上走 cross 容器（Ubuntu 16.04，
    # git 2.7），不认 `git init -b`、`git status --porcelain=v1`，测试环境比产品要求的 git 还老。
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: web/yarn.lock
      - name: Build embedded Web frontend
        working-directory: web
        run: yarn install --frozen-lockfile && yarn build
      - uses: houseabsolute/actions-rust-cross@v1
        with:
          command: test
          target: ${{ matrix.target }}
          args: --locked --workspace

  wsl-smoke:
    name: WSL ABI smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: web/yarn.lock
      - name: Build embedded Web frontend
        working-directory: web
        run: yarn install --frozen-lockfile && yarn build
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.1
      - name: Build the Linux x86_64 binary consumed by WSL 2
        run: cargo build --locked --release --target x86_64-unknown-linux-gnu -p willdeep
      - name: Smoke test executable and ELF ABI
        run: |
          target/x86_64-unknown-linux-gnu/release/willdeep --version
          file target/x86_64-unknown-linux-gnu/release/willdeep | grep 'ELF 64-bit LSB'
