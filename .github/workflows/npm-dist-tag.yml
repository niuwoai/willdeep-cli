name: npm dist-tag

# npmjs 页面只读 latest 标签指向的版本。发布流水线固定打 rc 标签，不会移动 latest。
# 这里手动把已发布的某个版本挂到指定标签，不重新发布。
on:
  workflow_dispatch:
    inputs:
      version:
        description: 已发布的版本，例如 0.134.0-rc5
        required: true
        type: string
      tag:
        description: 要移动的 dist-tag
        required: true
        default: latest
        type: string

jobs:
  retag:
    name: Move dist-tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Point the dist-tag at the published version
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ inputs.version }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          case "$VERSION" in
            *[!0-9A-Za-z.-]* | '' ) echo "版本号不合法：$VERSION" >&2; exit 1 ;;
          esac
          case "$TAG" in
            *[!0-9A-Za-z.-]* | '' ) echo "标签名不合法：$TAG" >&2; exit 1 ;;
          esac
          npm view "@niuwoai/willdeep@$VERSION" version >/dev/null
          npm dist-tag add "@niuwoai/willdeep@$VERSION" "$TAG"
          npm dist-tag ls @niuwoai/willdeep
