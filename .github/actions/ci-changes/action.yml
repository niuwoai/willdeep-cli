name: Detect whether the diff touches code
description: |
  Sets the code output to true when the diff changes a build or test result,
  and false for documentation-only changes. The heavy CI jobs stay
  unconditional so their check names always exist for branch protection;
  they skip their work when this reports false.

  The classification is by path, not by content: a comment edit inside a
  code file still counts as code. A test that starts reading a document
  must have that document's path added to the code list below.
runs:
  using: composite
  steps:
    - name: Resolve the diff range
      id: range
      shell: bash
      env:
        EVENT_NAME: ${{ github.event_name }}
        PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        PUSH_BEFORE_SHA: ${{ github.event.before }}
      run: |
        # 复用的 workflow、以及拿不到可比较父提交的事件，无法证明 diff 不含代码，跑全量。
        if [[ "$EVENT_NAME" == "workflow_call" ]]; then
          echo "base=" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        if [[ "$EVENT_NAME" == "pull_request" ]]; then
          echo "base=${PR_BASE_SHA}" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        # push 必须传 40 位小写提交 SHA。paths-filter 只把这种值当成提交。
        # 远程跟踪分支名会被当成远程 ref，浅克隆 fetch 会以 exit 128 失败。
        # 全 0 或缺失表示没有推送前的提交，范围不可证，跑全量。
        if [[ "$EVENT_NAME" == "push" && "$PUSH_BEFORE_SHA" =~ ^[0-9a-f]{40}$ && "$PUSH_BEFORE_SHA" != "0000000000000000000000000000000000000000" ]]; then
          echo "base=${PUSH_BEFORE_SHA}" >> "$GITHUB_OUTPUT"
        else
          echo "base=" >> "$GITHUB_OUTPUT"
        fi
    - name: Classify the changed paths
      id: filter
      if: steps.range.outputs.base != ''
      uses: dorny/paths-filter@v3
      with:
        base: ${{ steps.range.outputs.base }}
        filters: |
          code:
            - 'crates/**'
            - 'web/**'
            - 'npm/**'
            - 'integrations/**'
            - 'examples/**'
            - 'scripts/**'
            - '.github/**'
            - 'Cargo.toml'
            - 'Cargo.lock'
            - 'rust-toolchain*'
            - 'deny.toml'
            - 'clippy.toml'
            - 'rustfmt.toml'
            - '.rustfmt.toml'
    - name: Publish the classification
      id: publish
      shell: bash
      run: |
        if [[ -z "${{ steps.range.outputs.base }}" || "${{ steps.filter.outputs.code }}" == "true" ]]; then
          echo "code=true" >> "$GITHUB_OUTPUT"
        else
          echo "code=false" >> "$GITHUB_OUTPUT"
        fi
outputs:
  code:
    description: true when the diff touches code or the range cannot be proven docs-only
    value: ${{ steps.publish.outputs.code }}
