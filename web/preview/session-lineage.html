<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>会话分凉预览</title>
<style>
  body { margin: 0; }
  .preview-stage { display: flex; width: 1180px; height: 760px; background: var(--bg-page); }
  .preview-sidebar { width: 300px; flex: none; height: 100%; padding: 20px; border-right: 1px solid var(--border-subtle); background: var(--bg-surface); display: flex; flex-direction: column; }
  .preview-heading { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 18px; }
  .preview-heading h1 { margin: 0; font-size: 18px; line-height: 1.2; font-weight: 700; }
  .preview-heading p { margin: 4px 0 0; font-size: 12px; color: var(--text-faint); }
  .preview-section { display: flex; justify-content: space-between; align-items: baseline; margin: 18px 0 8px; font-size: 12px; color: var(--text-dim); }
  .preview-section span { font-size: 12px; }
  .preview-main { flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--bg-surface); }
  .preview-note { margin: auto 30px 24px; font-size: 12px; line-height: 1.7; color: var(--text-faint); }
</style>
</head>
<body>
<div id="root"></div>
<script type="module">
import "../src/theme.css";
import "../src/styles.css";
import "../src/chatWorkspace.css";
import { sessionTree } from "../src/sessionTree.ts";

const parent = "11111111-1111-1111-1111-111111111111";
const child = "22222222-2222-2222-2222-222222222222";
const grandchild = "33333333-3333-3333-3333-333333333333";

// 列表按更新时间排，分凉排在来源前面：分组要把它们挪回来源正下方。
const sessions = [
  { id: grandchild, title: "再分凉：只看错误处理", started_by: child, active: false },
  { id: "44444444-4444-4444-4444-444444444444", title: "日志巡检 Niuwo sslcat 状态", started_by: null, active: true },
  { id: child, title: "分凉：改成只读", started_by: parent, active: false },
  { id: "55555555-5555-5555-5555-555555555555", title: "新建 SDK 测试目录", started_by: parent, active: false },
  { id: parent, title: "这个价格计算对吗？", started_by: null, active: false },
];

function row(entry) {
  const selected = entry.session.id === child;
  const nested = entry.depth ? " nested" : "";
  const dot = entry.session.active ? '<span class="session-active-dot" aria-hidden="true"></span>' : "";
  return `<div class="session-row${nested}${selected ? " selected" : ""}">` +
    `<button type="button" class="session-title">${dot}${entry.session.title}</button></div>`;
}

document.querySelector("#root").innerHTML = `
<div class="preview-stage chat-workspace">
  <aside class="chat-sidebar preview-sidebar" aria-label="会话">
    <div class="preview-heading"><div><h1>WillDeep</h1><p>对话</p></div></div>
    <div class="preview-section"><span>会话</span><span>新会话</span></div>
    <div class="session-list">${sessionTree(sessions).map(row).join("")}</div>
  </aside>
  <main class="preview-main">
    <header class="conversation-toolbar">
      <div class="conversation-location">
        <span class="conversation-project">tokenhub</span>
        <span class="session-lineage">分凉自「这个价格计算对吗？」 · 2 小时前</span>
        <h1>分凉：改成只读</h1>
      </div>
    </header>
    <p class="preview-note">预览夹具：侧栏分组由 web/src/sessionTree.ts 实时计算，样式取自 theme.css、styles.css 与 chatWorkspace.css。会话标题是示例。</p>
  </main>
</div>`;
</script>
</body>
</html>
